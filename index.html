<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sablon Kaos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style id="css">
:root{--bg:#fff;--surface:#fff;--ink:#111;--muted:#555;--line:#e2e2e2;--m:#D90429;--y:#D90429;--c:#D90429;--wa:#D90429;--top:#111;--topfg:#fff;--onm:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--surface:#161616;--ink:#fff;--muted:#b5b5b5;--line:#2c2c2c;--wa:#E5173F}}
:root[data-theme="dark"]{--bg:#0a0a0a;--surface:#161616;--ink:#fff;--muted:#b5b5b5;--line:#2c2c2c;--wa:#E5173F}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{font:800 22px "Bricolage Grotesque",sans-serif;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo img{height:44px;max-width:160px;width:auto;object-fit:contain;display:block}
nav a{margin-left:18px;text-decoration:none;font-weight:600;font-size:15px}
nav a:hover{text-decoration:underline;text-decoration-color:var(--m);text-underline-offset:6px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding:36px 0 64px}
.hero h1{font-size:clamp(38px,7vw,68px);font-weight:800;letter-spacing:-.02em}
.hero p{max-width:46ch;color:var(--muted);margin:18px 0 26px}
.btn{display:inline-block;background:var(--wa);color:var(--onm);padding:14px 24px;border-radius:10px;font-weight:600;text-decoration:none;border:0;cursor:pointer;font:600 16px Figtree,sans-serif}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);margin-left:8px}
.top{background:var(--top);color:var(--topfg);border-bottom:6px solid var(--m)}
.top .hero p{color:var(--topfg);opacity:.8}
.top .btn.alt{color:var(--topfg);border-color:var(--topfg)}
:root[data-tpl="biru"]{--m:#1D4ED8;--wa:#1D4ED8;--c:#1D4ED8;--top:#0B1B3A}
:root[data-tpl="hijau"]{--m:#15803D;--wa:#15803D;--c:#15803D;--top:#0F2A1B}
:root[data-tpl="oranye"]{--m:#C2410C;--wa:#C2410C;--c:#C2410C;--top:#1C1917}
:root[data-tpl="min"]{--m:#111;--wa:#111;--c:#111;--top:#fff;--topfg:#111;--onm:#fff}
@media(prefers-color-scheme:dark){:root[data-tpl="min"]{--m:#fff;--wa:#fff;--c:#fff;--top:#0a0a0a;--topfg:#fff;--onm:#111}}
:root[data-lay="daftar"] .grid{grid-template-columns:1fr}
:root[data-lay="daftar"] .card{flex-direction:row}
:root[data-lay="daftar"] .card .img{width:160px;flex:none;display:flex;align-items:center}
:root[data-lay="daftar"] .card .btn{align-self:flex-start}
@media(max-width:520px){:root[data-lay="daftar"] .card .img{width:104px;padding:10px}}
:root[data-lay="poster"] .hero{grid-template-columns:1fr;text-align:center;padding:56px 0 72px}
:root[data-lay="poster"] .hero .reg{display:none}
:root[data-lay="poster"] .hero h1{font-size:clamp(44px,9vw,88px)}
:root[data-lay="poster"] .hero p{margin-left:auto;margin-right:auto}
:root[data-lay="poster"] .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.reg{position:relative;width:100%;max-width:380px;margin:auto;aspect-ratio:1}
.reg svg{position:absolute;inset:0;width:100%;height:100%}
.reg .l2{transform:translate(9px,5px)}.reg .l3{transform:translate(-6px,8px)}

section{padding:56px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(28px,4.5vw,40px);font-weight:800;margin-bottom:8px}
.sub{color:var(--muted);margin:0 0 28px;max-width:56ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .img{background:var(--line);padding:16px}
.card .img svg{width:100%;height:auto;display:block}
.card .img img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.card .b{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:19px}
.card p{margin:0;font-size:15px;color:var(--muted);flex:1}
.price{font-weight:800;color:var(--m)}
.card .btn{text-align:center;padding:11px;font-size:15px;margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;counter-reset:s;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.steps li:before{content:counter(s);display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--m);color:var(--onm);font-weight:800;margin-bottom:10px}
.steps b{display:block}
.ship{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.ship ul{margin:0;padding-left:20px;color:var(--muted)}
.ship li{margin-bottom:6px}
.couriers{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.couriers span{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 14px;font-weight:600;font-size:14px}
footer{background:var(--top);border-top:6px solid var(--m);padding:32px 0 96px;color:var(--topfg);font-size:15px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}
/* admin */
#editBtn{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ink);color:var(--bg);display:none}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:20;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px;display:none;box-shadow:-8px 0 30px rgba(0,0,0,.2);font-size:15px}
#panel.on{display:block}
#panel h3{font-size:20px;margin:22px 0 8px}
#panel label{display:block;font-weight:600;margin:10px 0 3px}
#panel input[type=text],#panel textarea,#panel select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#panel textarea{min-height:76px}
#panel input[type=color]{width:56px;height:36px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--bg)}
.pbar{position:sticky;top:0;background:var(--surface);padding:8px 0;display:flex;gap:8px;align-items:center;z-index:2}
.pbar .btn{padding:10px 16px;font-size:15px}
.prow{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.prow .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sm{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font:600 14px Figtree,sans-serif}
.sm.del{color:#c0173a;border-color:#c0173a}
#msg{font-size:14px;color:var(--muted);margin:6px 0}
.tps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tp{display:flex;align-items:center;gap:8px;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:600 14px Figtree,sans-serif;cursor:pointer;text-align:left}
.tp.on{border-color:var(--m)}
.tp i{width:26px;height:26px;border-radius:6px;border:1px solid #8884;flex:none}
@media(max-width:760px){.hero,.ship{grid-template-columns:1fr}.reg{max-width:260px}nav a:not(:last-child){display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="root"></div>
<button class="btn" id="editBtn" type="button">Edit website</button>
<aside id="panel" aria-label="Panel admin"></aside>
